name: Publish to Comfy registry

# Publishes whatever version string is in pyproject.toml. Bump it before
# publishing - re-publishing an existing version fails.
#
# DELIBERATELY MANUAL. The automatic trigger is commented out below so that
# nothing reaches the registry until it is run by hand from the Actions tab.
# To arm it later, uncomment the push block: after that, every push to main
# that touches pyproject.toml publishes.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
